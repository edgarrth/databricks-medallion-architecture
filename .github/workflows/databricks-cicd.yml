name: Databricks CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate notebook files
        run: |
          python - <<'PY'
          import json, pathlib
          notebooks = list(pathlib.Path(".").rglob("*.ipynb"))
          assert notebooks, "No notebooks found"
          for nb in notebooks:
              json.loads(nb.read_text(encoding="utf-8"))
              print(f"OK: {nb}")
          PY

      - name: Validate Databricks bundle
        run: |
          echo "Simulating: databricks bundle validate -t dev"
          echo "Bundle validation completed successfully."

      - name: Deploy Databricks bundle
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Simulating: databricks bundle deploy -t dev"
          echo "Bundle deployed successfully."

      - name: Run Databricks job
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Simulating: databricks bundle run fintech_medallion_job -t dev"
          echo "Job fintech_medallion_job finished successfully."
